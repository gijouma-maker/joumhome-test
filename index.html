<html lang="de">

<title>JoumHome</title>

<script>try{(function(){var d=document.documentElement,t=localStorage.getItem("hv_theme")||"kachel";if(localStorage.getItem("hv_tauto")==="1")t=matchMedia("(prefers-color-scheme: dark)").matches?"kachel":"papier";if(t!=="kachel")d.setAttribute("data-theme",t);if(localStorage.getItem("hv_big")==="1")d.setAttribute("data-big","");})();}catch(e){}</script>

<style>
/* Design „Kachel“: Schwarz, dunkelgraue Kacheln ohne Rahmen, Weiß als einziger Akzent; Hervorhebung durch Umkehrung (weiße Fläche, schwarze Schrift). Logo des Nutzers unverändert schwarz auf weiß. */
:root{
  --bg:#000000; --surface:#141414; --surface2:#1c1c1c; --ink:#ffffff; --muted:#8a8a8a; --line:#232323;
  --accent:#ffffff; --accent-ink:#000000; --accent-soft:#1c1c1c;
  --em:#9a9a9a; --em-soft:#1c1c1c;
  --ok:#9a9a9a; --ok-soft:#1c1c1c; --warn:#ffffff; --warn-soft:#262626; --bad:#ffffff; --bad-soft:#ffffff;
  --surface3:#262626; --deep:#0b0b0b; --hi:#ffffff; --hi-ink:#000000; --hi-muted:#444444; --hi-soft:#cccccc; --line2:#333333; --glass:rgba(0,0,0,.92); --glass2:rgba(20,20,20,.97);
  --font-display:"Jost", "Futura", "Century Gothic", sans-serif;
  --font-body:"Jost", "Futura", "Segoe UI", sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500;letter-spacing:-.005em}
h1{font-family:var(--font-display);font-size:24px;font-weight:300;letter-spacing:.01em}
h2{font-family:var(--font-display);font-size:20px;font-weight:400}
.kpi .v,.hero .big,.hero .stats div b{font-weight:300}
h3{font-size:15px;font-weight:600}
.num,.money{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px}
.top-in .t{flex:1;min-width:0}
.top-in small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em}
main{max-width:760px;margin:0 auto;padding:18px 16px 120px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;width:100%;max-width:560px;background:var(--glass2);border:1px solid var(--line);border-radius:999px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
nav.tabs button{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);cursor:pointer;border-radius:999px;position:relative}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface3);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--surface2);border-color:var(--hi);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--surface);border-radius:var(--r);padding:16px}
.card.tap{cursor:pointer;transition:border-color .15s}
.card.tap:hover{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px}
.item.s-ok,.item.s-warn,.item.s-bad,.item.s-neutral{border-inline-start-width:1px}
.item .meta{color:var(--muted);font-size:12.5px}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .head b{font-weight:600}
.item.tap:hover{border-color:var(--accent)}
.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.tile svg{width:19px;height:19px}
.tile.bad{background:var(--bad-soft);color:var(--bad)} .tile.warn{background:var(--warn-soft);color:var(--warn)} .tile.ok{background:var(--ok-soft);color:var(--ok)}
.prog{display:flex;gap:4px}
.prog span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog span.on1{background:var(--bad)} .prog span.on2{background:var(--warn)} .prog span.on3{background:var(--em)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:transparent;color:var(--muted);border:1px solid var(--line)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--surface);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{color:var(--muted);font-size:12px;letter-spacing:.03em}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{background:var(--surface);border:1px solid var(--surface);border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:12.5px;text-align:center;color:var(--ink)}
.quick button svg{width:22px;height:22px;color:var(--accent)}
.quick button:hover{border-color:var(--accent)}
.quick button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quick button.main svg{color:var(--accent-ink)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title span{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:24px 14px;border:1px dashed var(--line);border-radius:var(--r)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.info{background:var(--accent-soft);color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:140px 1fr 90px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .amt{text-align:end}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.backdrop.open{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:24px;max-height:86%}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=month],.field input[type=time],.field input[type=datetime-local],.field input[type=tel],.field input[type=email],.field select,.field textarea,.fx{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;width:100%;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.field.chk{flex-direction:row;align-items:center;gap:10px}
.field.chk input{width:20px;height:20px;accent-color:var(--accent)}
.field.chk label{color:var(--ink);font-weight:500;font-size:14.5px;letter-spacing:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
@media(max-width:420px){.fields{grid-template-columns:1fr}}
.ai{display:flex;gap:10px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;z-index:40;font-size:14px;font-weight:600;display:none;max-width:90%}
.toast.show{display:block}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;align-self:flex-start}
.mrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.small{font-size:12.5px;color:var(--muted)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--hi);color:var(--hi-ink);border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}
.ta-wrap{position:relative}
.ta-wrap textarea{padding-inline-end:52px!important}
.mic{position:absolute;inset-inline-end:8px;bottom:8px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--accent)}
.mic.rec{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.mic svg{width:18px;height:18px}
.mic-live{color:var(--muted);font-style:italic}
.voice{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--hi);background:transparent;color:var(--ink);border-radius:999px;padding:13px;font-weight:700;cursor:pointer}
.voice svg{width:20px;height:20px}
#langSel{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 10px;max-width:118px;color:var(--ink)}
table.ja{width:100%;border-collapse:collapse;font-size:14px}
table.ja td,table.ja th{padding:9px 4px;border-top:1px solid var(--line);text-align:start;font-weight:500}
table.ja th{color:var(--muted);font-size:12px}
table.ja td.n,table.ja th.n{text-align:end;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.hero{position:relative;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--surface);padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--font-display);font-size:30px;line-height:1.1}
.hero .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.hero .stats div b{display:block;font-family:var(--font-display);font-size:22px;font-weight:400}
.hero .stats div span{font-size:12px;color:var(--muted)}
.hero.img{min-height:190px;justify-content:flex-end;background-size:cover;background-position:center}
.hero.img::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.25))}
.hero.img>*{position:relative}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gallery .g{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.gallery .g img,.gallery .g video{width:100%;height:100%;object-fit:cover;display:block}
.gallery .g .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10.5px;background:rgba(0,0,0,.75)}
.gallery .g .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:26px}
.score-wrap{display:flex;align-items:center;gap:16px}
.score-wrap svg{flex:none}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.sig{width:100%;height:150px;background:var(--bg);border:1px dashed var(--accent);border-radius:12px;touch-action:none;display:block}
.prot-row{display:grid;grid-template-columns:1.1fr .9fr 1.4fr;gap:6px;align-items:center}
.prot-row.z{grid-template-columns:1.2fr 1fr 1fr}
.prot-row.k{grid-template-columns:2fr 1fr}
/* Monochrome Status: Neu = weiß gefüllt, In Arbeit = weiß umrandet, Erledigt = grau */
.pill.bad{background:var(--hi);color:var(--hi-ink)} .pill.warn{background:transparent;color:var(--ink);border:1px solid var(--hi)} .pill.ok{background:var(--surface2);color:var(--muted)}
.tile{background:var(--surface2);color:var(--ink)} .tile.bad{background:var(--hi);color:var(--hi-ink)} .tile.warn{background:var(--surface);color:var(--ink);border:1px solid var(--hi)} .tile.ok{background:var(--surface2);color:var(--muted)}
.prog span{background:var(--surface3)} .prog span.on1,.prog span.on2{background:var(--hi)} .prog span.on3{background:var(--muted)}
.kpi.bad .v,.kpi.warn .v{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.note{background:var(--surface2);color:var(--ink);border:1px solid var(--hi)}
.ai{background:var(--surface2);color:var(--ink)}
.brand-tile{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;cursor:pointer;overflow:hidden}
.brand-tile img{width:30px;height:33px;object-fit:contain}
.logo-card{background:#fff;border-radius:22px;display:flex;justify-content:center;align-items:center;padding:14px}
.logo-card img{height:118px;width:auto;object-fit:contain}
.gauge{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.stile{background:var(--surface);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;border:0;color:var(--ink)}
.stile b{display:block;font-size:24px;font-weight:300}
.stile span{font-size:12px;color:var(--muted)}
.stile.low{background:var(--hi);color:var(--hi-ink)} .stile.low span{color:var(--hi-muted)}
.role{font-size:11px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.ztiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick-k{background:var(--surface);border:1px solid var(--surface);border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);text-align:center}
.quick-k svg{width:22px;height:22px}
.quick-k b{font-weight:500;font-size:14px}
.quick-k span{font-size:11.5px;color:var(--muted)}
.quick-k.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.quick-k.on span{color:var(--hi-muted)}
.tip{position:fixed;z-index:50;max-width:min(300px,86vw);background:var(--hi);color:var(--hi-ink);border-radius:14px;padding:10px 13px;font-size:13.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;pointer-events:none}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip::after{content:"";position:absolute;left:var(--ax,50%);width:10px;height:10px;background:var(--hi);transform:translateX(-50%) rotate(45deg)}
.tip.below::after{top:-5px} .tip:not(.below)::after{bottom:-5px}
.help-btn{font-weight:600;font-size:15px}
.help-btn.off{color:var(--muted);text-decoration:line-through}

.spd{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.spd .big{font-size:44px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.spd .unit{font-size:14px;color:var(--muted);margin-inline-start:6px}

.spd-btn{width:100%;max-width:168px;aspect-ratio:1;border-radius:50%;border:0;background:transparent;padding:0;cursor:pointer;position:relative;color:var(--ink)}

.func-btn svg{width:17px;height:17px;flex:none}
.func-btn:hover{border-color:var(--hi)}

.fn-lab{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.th-grid{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.th-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.th-card{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.th-card[aria-pressed="true"]{border-color:var(--hi);box-shadow:inset 0 0 0 2px var(--hi)}
.th-prev{height:58px;border-radius:10px;border:1px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:7px}
.th-prev i{display:block;height:16px;border-radius:5px;border:1px solid}
.th-prev b{display:block;height:9px;width:60%;border-radius:5px}
.th-n{font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.th-n em{font-style:normal;font-size:11px;font-family:var(--font-body);background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:1px 8px}
.th-card small{color:var(--muted);font-size:12px;line-height:1.3}
.fn-group{flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.fn-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;text-align:start;cursor:pointer;box-sizing:border-box}
.fn-row:first-child{border-top:0}
.fn-row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.fn-row .tx b{font-weight:600}
.fn-row .tx small{color:var(--muted);font-size:12.5px}
.fn-row select{width:auto;max-width:170px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;height:38px;padding:0 12px}
.fn-row .chev{color:var(--muted);flex:none}
.sw{width:50px;height:30px;border-radius:999px;background:var(--surface3);border:1px solid var(--line);padding:2px;display:flex;align-items:center;flex:none;box-sizing:border-box;transition:background .15s}
.sw::after{content:"";width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.fn-row[aria-pressed="true"] .sw{background:var(--hi);border-color:var(--hi)}
.fn-row[aria-pressed="true"] .sw::after{transform:translateX(20px);background:var(--hi-ink)}
[dir="rtl"] .fn-row[aria-pressed="true"] .sw::after{transform:translateX(-20px)}
</style>

<script>
"use strict";
/* ---------- Konstanten ---------- */
const KAT = ["Heizung/Brennstoff","Wasser/Abwasser","Strom (Allgemein)","Müllabfuhr","Grundsteuer","Versicherung","Hausmeister/Reinigung","Gartenpflege","Schornsteinfeger/Wartung","Reparatur/Handwerker","Material/Baumarkt","Möbel/Ausstattung","Rechtsanwalt/Gericht","Sonstiges"];
const UMLAGE_KAT = ["Heizung/Brennstoff","Wasser/Abwasser","Strom (Allgemein)","Müllabfuhr","Grundsteuer","Versicherung","Hausmeister/Reinigung","Gartenpflege","Schornsteinfeger/Wartung"];
const VERSTOSS = ["Biomüll in Restmüll","Falsches in Gelber Tonne","Papiertonne falsch befüllt","Glas falsch entsorgt","Sperrmüll abgestellt","Müll neben der Tonne","Kehrwoche nicht erledigt","Garten nicht gepflegt","Treppenhaus/Keller zugestellt","Ruhezeiten nicht eingehalten","Sonstiges"];
const ZAEHLER = ["Strom","Wasser kalt","Wasser warm","Gas","Heizung (Heizkostenverteiler)","Wärmemenge"];
const SCHADEN_ST = ["Gemeldet","Handwerker beauftragt","Erledigt"];
const BRETT_ART = ["Info vom Vermieter","Zu verschenken","Zu verkaufen","Gesucht","Feier / Geburtstag","Sonstiges"];
const MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const TSTAT = ["Neu","In Bearbeitung","Erledigt"];
const KTR = ["Vermieter","Mieter (verursacht)"];
const isMK = a => a.kostentraeger==="Mieter (verursacht)";
const PRIO = ["Normal","Dringend"];
const QUELLE = ["Mieter per WhatsApp","Mieter per Telefon","Mieter persönlich","Selbst festgestellt","Hausmeister / Nachbar"];
const COLS = ["objekte","wohnungen","mieter","ausgaben","verstoesse","zahlungen","zaehler","schaeden","reinigung","brett","garten","medien","protokolle","rollen","speedtests","vertraege","portal","eingang","anfragen","nachrichten","inventar","fixkosten","handwerker","auftraege","mahnungen","hwportal","hweingang"];

/* ---------- Zustand ---------- */
const st = {
  db:null, assets:null, sample:null, dl:null, cfg:{},
  data:Object.fromEntries(COLS.map(c=>[c,{}])), seen:new Set(), loaded:false, slow:false, noDb:false,
  tab:"start", sub:{haeuser:"objekte", geld:"hub", gemein:"kehrwoche", tickets:"offen", hw:"auftraege"},
  role:"master", myId:null, user:null, objekt:null, mieter:null, lang:(()=>{try{return localStorage.getItem("hv_lang")||"de"}catch(e){return "de"}})(), dict:null, year:String(new Date().getFullYear()), fObj:"", kwObj:"", q:""
};

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const curYm = () => today().slice(0,7);
const ymAdd = (ym,n) => { let [y,m]=ym.split("-").map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return `${y}-${pad(m)}`; };
const fmtDate = s => { if(!s) return ""; const [y,m,d]=String(s).slice(0,10).split("-"); return d?`${d}.${m}.${y}`:s; };
const fmtDT = s => { if(!s) return ""; const t=String(s).slice(11,16); return fmtDate(s)+(t?` · ${t} Uhr`:""); };
const fmtYm = (ym,L) => { if(!ym) return ""; const [y,m]=ym.split("-"); L=L||st.lang; if(L==="de") return `${MONATE[+m-1]} ${y}`; return new Date(+y,+m-1,1).toLocaleDateString(LOCALE[L]==="ar"?"ar-u-nu-latn":LOCALE[L],{month:"long",year:"numeric"}); };
const eur = n => (Number(n)||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const num = v => { if(v===""||v==null) return null; const n=Number(v); return isNaN(n)?null:n; };
const list = c => Object.values(st.data[c]);
const assetUrl = id => id ? (window.__jhAsset?window.__jhAsset(id):"/_blob/"+encodeURIComponent(id)) : "";
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600); }

/* Übersetzung */
function tr0(s,L){ L=L||st.lang; if(L==="de"||!s) return s; const i=LIDX[L]; if(i==null) return s; const e=I18N[s]; if(e) return e[i];
  for(const [re,arr] of I18P){ const m=s.match(re); if(m) return arr[i].replace(/\$(\d)/g,(_,n)=>{ const p=m[n]||""; const r=tr0(p,L); return r==null?p:r; }); }
  return null; }
function tr(s,L){ const r=tr0(s,L); return r==null?s:r; }
function trText(s){ const t=s.trim(); if(!t) return s; let r=tr0(t); if(r==null && t.includes(" · ")) r=t.split(" · ").map(p=>{const x=tr0(p);return x==null?p:x;}).join(" · "); return r==null?s:s.replace(t,r); }
function trNode(n){
  if(n.nodeType===3){ const p=n.parentElement; if(!p||p.closest("textarea,script,style,[data-notr]")) return; if(n.__o===undefined) n.__o=n.data; const v=st.lang==="de"?n.__o:trText(n.__o); if(n.data!==v) n.data=v; }
  else if(n.nodeType===1){ if(n.closest("[data-notr]")) return; for(const a of ["placeholder","aria-label","title"]) if(n.hasAttribute(a)){ const k="data-o-"+a; if(!n.hasAttribute(k)) n.setAttribute(k,n.getAttribute(a)); const v=st.lang==="de"?n.getAttribute(k):trText(n.getAttribute(k)); if(n.getAttribute(a)!==v) n.setAttribute(a,v); } }
}
function trTree(root){ if(!root) return; trNode(root); if(root.nodeType!==1) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT); while(w.nextNode()) trNode(w.currentNode); }
let trSeen=false;
new MutationObserver(ms=>{ if(st.lang==="de"&&!trSeen) return; for(const m of ms) m.addedNodes.forEach(trTree); }).observe(document.body,{childList:true,subtree:true});
function setLang(L){ st.lang=L; try{localStorage.setItem("hv_lang",L)}catch(e){} if(L!=="de") trSeen=true; document.documentElement.lang=L; document.documentElement.dir=L==="ar"?"rtl":"ltr"; $("#langSel").value=L; render(); trTree(document.body); }
$("#langSel").innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join("");
/* ---------- Designs (Funktionen › Design) ---------- */
const THEMES=[
  {id:"kachel",name:"Kachel",desc:"Schwarz & Weiß",bg:"#000000",surface:"#141414",line:"#141414",accent:"#ffffff",head:'"Jost", sans-serif'},
  {id:"papier",name:"Papier",desc:"Hell & ruhig",bg:"#F4F3EF",surface:"#FFFFFF",line:"#E2E0DA",accent:"#1A1A1A",head:'"Jost", sans-serif'},
  {id:"nacht",name:"Nachtblau",desc:"Dunkel, blauer Akzent",bg:"#0B1220",surface:"#151E30",line:"#151E30",accent:"#7AB0FF",head:'"Inter", sans-serif'},
  {id:"salbei",name:"Salbei",desc:"Hell & grün",bg:"#EEF2EC",surface:"#FFFFFF",line:"#D5DED1",accent:"#2F6B4F",head:'"Jost", sans-serif'},
  {id:"sand",name:"Sand",desc:"Warm, mit Serifen",bg:"#F4EDE3",surface:"#FFFBF5",line:"#E6DACA",accent:"#A84B24",head:'"DM Serif Display", serif'},
  {id:"kontrast",name:"Kontrast",desc:"Große Schrift, klar",bg:"#FFFFFF",surface:"#FFFFFF",line:"#000000",accent:"#0046AD",head:'"Atkinson Hyperlegible", sans-serif'}
];
st.theme=(()=>{ try{ const t=localStorage.getItem("hv_theme"); return THEMES.some(x=>x.id===t)?t:"kachel"; }catch(e){ return "kachel"; } })();
st.themeAuto=(()=>{ try{ return localStorage.getItem("hv_tauto")==="1"; }catch(e){ return false; } })();
st.big=(()=>{ try{ return localStorage.getItem("hv_big")==="1"; }catch(e){ return false; } })();
function curTheme(){ if(st.themeAuto){ try{ return matchMedia("(prefers-color-scheme: dark)").matches?"kachel":"papier"; }catch(e){} } return st.theme; }
function applyTheme(){ const r=document.documentElement, id=curTheme(); if(id==="kachel") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",id); if(st.big) r.setAttribute("data-big",""); else r.removeAttribute("data-big"); }
applyTheme();
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(st.themeAuto) applyTheme(); }); }catch(e){}
const FN_CHEV='<svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
function openFuncs(){
  const cur=curTheme();
  const cards=THEMES.map(t=>`<button class="th-card" data-act="setTheme" data-theme="${t.id}" aria-pressed="${cur===t.id}"><span class="th-prev" style="background:${t.bg}"><i style="background:${t.surface};border-color:${t.line}"></i><b style="background:${t.accent}"></b></span><span class="th-n" style="font-family:${t.head}">${t.name}${cur===t.id?"<em>Aktiv</em>":""}</span><small>${t.desc}</small></button>`).join("");
  const voice=!st.tts?"In dieser Ansicht nicht verfügbar":(st.speakHints?"An":"Aus")+" · Stimme & Tempo wählen";
  openSheet(`<div class="spread"><h2>Funktionen</h2><button class="btn sm ghost" data-act="close">Schließen</button></div>
  <div class="fn-lab">Design</div>
  <div class="th-grid">${cards}</div>
  <div class="fn-lab">Anzeige</div>
  <div class="fn-group">
    <button class="fn-row" data-act="toggleBig" aria-pressed="${!!st.big}"><span class="tx"><b>Größere Schrift</b><small>Alles etwas größer lesen</small></span><span class="sw" aria-hidden="true"></span></button>
    <button class="fn-row" data-act="toggleAuto" aria-pressed="${!!st.themeAuto}"><span class="tx"><b>Hell/Dunkel wie Handy</b><small>Tagsüber Papier, abends Kachel</small></span><span class="sw" aria-hidden="true"></span></button>
  </div>
  <div class="fn-lab">Sprache &amp; Hilfe</div>
  <div class="fn-group">
    <div class="fn-row" style="cursor:default"><span class="tx"><b>Sprache</b></span><select id="fnLang" aria-label="Sprache" data-notr>${LANGS.map(([c,n])=>`<option value="${c}"${c===st.lang?" selected":""}>${n}</option>`).join("")}</select></div>
    <button class="fn-row" data-act="fnVoice"><span class="tx"><b>Sprachhilfe (Vorlesen)</b><small>${voice}</small></span>${FN_CHEV}</button>
    <button class="fn-row" data-act="fnHints" aria-pressed="${!!hintsOn}"><span class="tx"><b>Hilfe-Hinweise</b><small>Funktion gedrückt halten zeigt die Erklärung</small></span><span class="sw" aria-hidden="true"></span></button>
  </div>
  <div class="small" style="color:var(--muted)">Wird auf diesem Gerät gespeichert.</div>`);
}
document.addEventListener("change",e=>{ if(e.target&&e.target.id==="fnLang"){ setLang(e.target.value); openFuncs(); } });

const VOICES=[["rounded","Warm & tief","männlich · Assistent"],["airy","Hell & freundlich","weiblich · wie eine Navi- oder Bluetooth-Ansage"],["glassy","Klar & ruhig","sachlich"],["buttery","Weich & natürlich","Standard"]];
st.voice=(()=>{ try{ return localStorage.getItem("hv_voice")||"rounded"; }catch(e){ return "rounded"; } })();
st.rate=(()=>{ try{ return Number(localStorage.getItem("hv_rate"))||1.05; }catch(e){ return 1.05; } })();
function say(text){ if(!st.tts) return Promise.resolve(); return st.tts.speak(String(text).slice(0,2000),{language:LOCALE[st.lang]||st.lang,voice:st.voice,rate:st.rate}).catch(()=>{}); }
const VOICE_PROBE={de:"Guten Tag. Ich bin Ihr Assistent für JoumHome. Alle Systeme sind bereit.",tr:"İyi günler. Ben JoumHome asistanınızım. Tüm sistemler hazır.",ar:"مرحباً. أنا مساعدك في JoumHome. جميع الأنظمة جاهزة.",ru:"Добрый день. Я ваш ассистент JoumHome. Все системы готовы.",es:"Buenos días. Soy su asistente de JoumHome. Todos los sistemas están listos.",fr:"Bonjour. Je suis votre assistant JoumHome. Tous les systèmes sont prêts.",en:"Good day. I am your JoumHome assistant. All systems are ready."};
function openVoice(){
  if(!st.tts){ toast("Vorlesen ist in dieser Ansicht nicht verfügbar"); return; }

/* Fachlogik */
function zStatus(z){

  if(bez < soll-0.005) return "Teilzahlung";

function scoreOf(m){
  const from=(m.beginn||"").slice(0,7), fromD=m.beginn||"";

    case "Zu verschenken": return `${von} verschenkt: ${b.text||""}`;
    case "Zu verkaufen": return `${von} verkauft: ${b.text||""}${b.preis?` für ${eur(b.preis)}`:""}`;
    case "Gesucht": return `${von} sucht: ${b.text||""}`;
    case "Info vom Vermieter": return `Info vom Vermieter: ${b.text||""}`;
    default: return `${von}: ${b.text||""}`;
  }
}
function brettEmpf(b){
  return list("mieter").filter(m=>{
    if(m.aktiv===false || objOfMieter(m)!==b.objektId || (b.vonWohnungId && m.wohnungId===b.vonWohnungId)) return false;
    if(b.art==="Info vom Vermieter") return true;
    if(m.stumm) return false;
    if(b.art==="Feier / Geburtstag") return m.feiern!==false;
    if(["Zu verschenken","Zu verkaufen","Gesucht"].includes(b.art)) return m.markt!==false;
    return true;
  });
}
function zVerbrauch(z){
  const prev=list("zaehler").filter(x=>x.wohnungId===z.wohnungId && x.art===z.art && (x.nummer||"")===(z.nummer||"") && x.datum<z.datum).sort((a,b)=>b.datum.localeCompare(a.datum))[0];
  if(!prev || z.stand==null || prev.stand==null) return null;
  return Math.round((z.stand-prev.stand)*100)/100;
}

const TCOLS=["schaeden","verstoesse"];
function tStatus(col,d){ if(col==="schaeden") return d.status==="Erledigt"?"Erledigt":(d.status==="Gemeldet"?"Neu":"In Bearbeitung"); return d.tstatus||"Neu"; }
const tCls = s => ({Neu:"bad","In Bearbeitung":"warn",Erledigt:"ok"}[s]);
function tickets(){ return TCOLS.flatMap(c=>list(c).map(d=>({col:c,d,s:tStatus(c,d)}))); }
function nextNr(){ return Math.max(1000,...tickets().map(t=>Number(t.d.nr)||0))+1; }
const tNr = d => d.nr?`#${d.nr}`:"#–";
function tTitle(col,d){ return col==="schaeden"?(d.beschreibung||"Schaden"):(d.art||"Verstoß"); }
function ago(iso){ if(!iso) return ""; const days=Math.floor((Date.now()-new Date(iso.length<=10?iso+"T12:00:00":iso))/864e5); return days<=0?"heute":(days===1?"seit gestern":`seit ${days} Tagen`); }
async function logT(col,id,text,extra={}){
  const d=st.data[col][id]; if(!d) return;
  const verlauf=[...(Array.isArray(d.verlauf)?d.verlauf:[]),{t:new Date().toISOString(),text}].slice(-100);

}

async function runSpeed(){

  try{
    const ts=[]; for(let i=0;i<6;i++){ const t0=performance.now(); await fetch("ping.txt?r="+Math.random(),{cache:"no-store"}); ts.push(performance.now()-t0); spdLive(null,(i+1)*3); }
    ts.shift(); ts.sort((a,b)=>a-b); SPD.ping=ts[Math.floor(ts.length/2)]; SPD.jit=ts[ts.length-1]-ts[0]; spdPaint();
    SPD.phase="down"; spdPaint();
    let bytes=0; const start=performance.now(), LIMIT=8000;
    const one=async()=>{ while(performance.now()-start<LIMIT){ const r=await fetch("speed.png?r="+Math.random(),{cache:"no-store"}); const rd=r.body.getReader(); while(true){ const {done,value}=await rd.read(); if(done) break; bytes+=value.length; const el=performance.now()-start; if(el>LIMIT){ rd.cancel().catch(()=>{}); break; } spdLive(mbit(bytes,el),20+Math.min(60,el/LIMIT*60)); } } };
    await Promise.all([one(),one(),one()]);

      SPD.phase="up"; spdPaint();
      const parts=[]; const chunk=new Uint8Array(48000); const al="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      for(let k=0;k<64;k++){ crypto.getRandomValues(chunk); let s2=""; for(let j=0;j<chunk.length;j++) s2+=al[chunk[j]%62]; parts.push(s2); }
      const blob=new Blob(parts,{type:"text/plain"}); spdLive(null,85);
      const t0=performance.now(); let r=null; try{ r=await st.assets.upload(blob); SPD.up=mbit(blob.size,performance.now()-t0); }catch(e){ SPD.up=null; }
      if(r?.id) st.assets.delete(r.id).catch(()=>{});
    }
  }catch(e){ console.error(e); toast("Speedtest fehlgeschlagen – bitte erneut versuchen"); }
  SPD.run=false; SPD.phase=""; SPD.prog=100; SPD.when=new Date().toISOString(); spdPaint();
  if(SPD.down!=null) say(spdSpeech());
}

Die monatliche Miete beträgt:
– Kaltmiete: ${VE(v.kalt)}
– Vorauszahlung Betriebskosten (§ 2 BetrKV, ohne Heizung): ${VE(v.nk)}
– Vorauszahlung Heiz- und Warmwasserkosten: ${VE(v.heiz)}${v.extra?`\n– Sonstiges: ${VE(v.extra)}`:""}
Gesamt monatlich: ${VE((Number(v.kalt)||0)+(Number(v.nk)||0)+(Number(v.heiz)||0)+(Number(v.extra)||0))}
Der Vermieter rechnet über die Vorauszahlungen jährlich ab; die Abrechnung ist dem Mieter spätestens zwölf Monate nach Ende des Abrechnungszeitraums mitzuteilen (§ 556 Abs. 3 BGB). Heiz- und Warmwasserkosten werden nach der Heizkostenverordnung verteilt, die übrigen Betriebskosten nach Wohnfläche, soweit nicht nach Verbrauch erfasst.

§ 4 Zahlung
Die Miete ist monatlich im Voraus, spätestens bis zum dritten Werktag eines Monats, kostenfrei auf folgendes Konto zu zahlen: ${VS(v.bank)}, IBAN ${VS(v.iban)}. Für die Rechtzeitigkeit kommt es auf den Eingang des Geldes an.

§ 5 Mietsicherheit
Der Mieter leistet eine Kaution von ${VE(v.kaution)} (höchstens drei Monatskaltmieten). Er darf sie in drei gleichen monatlichen Teilzahlungen erbringen, die erste zu Beginn des Mietverhältnisses (§ 551 BGB). Der Vermieter legt die Kaution getrennt von seinem Vermögen bei einem Kreditinstitut zum üblichen Zinssatz an.

§ 6 Nutzung, Untervermietung, Tierhaltung
Eine Untervermietung oder Gebrauchsüberlassung an Dritte ist nur mit Erlaubnis des Vermieters zulässig (§ 540 BGB). Tierhaltung: ${VS(v.tiere)}. Die Erlaubnis kann aus wichtigem Grund widerrufen werden.

§ 7 Hausordnung und Reinigung
Die Hausordnung ist Bestandteil dieses Vertrags. Der Mieter beteiligt sich nach dem Reinigungsplan an der Reinigung von Treppenhaus, Kellertreppe, Außentreppen und Vorgarten. Die Mülltrennung ist einzuhalten.

§ 8 Instandhaltung und Schäden
Der Mieter hat die Mietsache pfleglich zu behandeln und Schäden unverzüglich anzuzeigen (§ 536c BGB). Für schuldhaft verursachte Schäden haftet er. Im Übrigen gelten für Instandhaltung und Schönheitsreparaturen die gesetzlichen Regelungen.

§ 9 Übergabe und Rückgabe
Die Wohnung wird in dem Zustand übergeben, der im Übergabeprotokoll festgehalten ist. Übergeben werden: ${VS(v.schluessel)}. Bei Ende des Mietverhältnisses ist die Wohnung besenrein mit allen Schlüsseln zurückzugeben.

§ 10 Kontakt und Datenschutz
Der Vermieter verarbeitet die Daten des Mieters zur Durchführung des Mietverhältnisses (Art. 6 Abs. 1 lit. b DSGVO). Eine Kontaktaufnahme per Messenger erfolgt nur nach gesonderter Einwilligung.

§ 11 Sonstige Vereinbarungen
${v.sonst?v.sonst:"Keine."}

§ 12 Schlussbestimmungen
Änderungen und Ergänzungen dieses Vertrags sollen in Textform erfolgen. Sollte eine Bestimmung unwirksam sein, bleibt der Vertrag im Übrigen wirksam; es gilt dann die gesetzliche Regelung.`},

§ 2 Mietzeit und Kündigung
Das Mietverhältnis beginnt am ${VD(v.beginn)} und läuft auf unbestimmte Zeit. Es ist unabhängig von einem etwaigen Wohnungsmietvertrag. Die Kündigung ist spätestens am dritten Werktag eines Kalendermonats zum Ablauf des übernächsten Monats zulässig (§ 580a Abs. 1 BGB).

function kuendEnde(zugang){ // § 573c Abs. 1 BGB: bis 3. Werktag (Mo–Sa) zugegangen → Ende des übernächsten Monats
  const d=new Date((zugang||today())+"T12:00:00"); let wt=0; for(let i=1;i<=d.getDate();i++){ const x=new Date(d.getFullYear(),d.getMonth(),i); if(x.getDay()!==0) wt++; }

 text:v=>`Zwischen ${VS(v.vName)}, ${VS(v.vAdr)} – „Auftraggeber“ – und ${VS(v.mName)}${v.mAdr?`, ${v.mAdr}`:""} – „Auftragnehmer“ – wird folgender Werkvertrag geschlossen:

§ 1 Leistung
Der Auftragnehmer führt im Objekt ${VS(v.objAdr)}${v.lage?`, ${v.lage}`:""} folgende Arbeiten aus:
${VS(v.leistung)}

§ 2 Ausführung
Die Arbeiten werden fachgerecht nach den anerkannten Regeln der Technik ausgeführt${v.termin?` und sind bis ${v.termin} fertigzustellen`:""}. Zugang: ${VS(v.zugang)}. Der Auftragnehmer stimmt Termine mit den Bewohnern rechtzeitig ab und hinterlässt die Arbeitsstelle sauber. Nach Fertigstellung dokumentiert er die Arbeiten mit Fotos.

§ 3 Vergütung
${v.preisArt==="Festpreis"?`Für die Leistung wird ein Festpreis von ${VE(v.preis)} ${VS(v.ust)} vereinbart.`:v.preisArt==="laut Angebot"?`Die Vergütung richtet sich nach dem Angebot vom ${VD(v.angebotVom)}${v.preis?` über ${VE(v.preis)}`:""}, ${VS(v.ust)}.`:`Abgerechnet wird nach Aufwand zu einem Stundensatz von ${VE(v.stundensatz)} zzgl. Material, ${VS(v.ust)}${v.preis?`; der Gesamtbetrag darf ${VE(v.preis)} nicht ohne vorherige Zustimmung des Auftraggebers überschreiten`:""}.`} Mehrarbeiten oder zusätzliche Kosten werden nur nach vorheriger Zustimmung des Auftraggebers vergütet.

§ 4 Abnahme und Zahlung
Nach Fertigstellung erfolgt die Abnahme. Die Rechnung ist ${VS(v.zahlung)} zur Zahlung fällig. Die Rechnung weist den Arbeitslohn gesondert aus (§ 35a EStG).

§ 5 Gewährleistung und Haftung
Es gelten die gesetzlichen Gewährleistungsrechte (§§ 633 ff. BGB). Der Auftragnehmer haftet für Schäden, die er oder seine Mitarbeiter bei der Ausführung schuldhaft verursachen, und unterhält eine Betriebshaftpflichtversicherung.

§ 6 Schlussbestimmungen
Änderungen und Ergänzungen bedürfen der Textform. Sollte eine Bestimmung unwirksam sein, bleibt der Vertrag im Übrigen wirksam.`};

async function vertragPdf(titel,txt,ort,dat,v,svB,smB,who){
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:"mm",format:"a4"}); let y=22;
  if(st.logoDu){ try{ d.addImage(st.logoDu,"PNG",172,10,16,18.3); }catch(e){} }
  d.setFont("helvetica","bold"); d.setFontSize(15); d.text(titel,20,y); y+=10;
  d.setFont("helvetica","normal"); d.setFontSize(10.5);
  for(const para of txt.split("\n")){
    const bold=/^§\s*\d+/.test(para)||/^Einwilligung/.test(para); d.setFont("helvetica",bold?"bold":"normal");
    const ls=para?d.splitTextToSize(para,170):[""];
    for(const l of ls){ if(y>275){ d.addPage(); y=20; } d.text(l,20,y); y+=5.1; }
    if(bold) y+=0.6;
  }
  y+=8; if(y>240){ d.addPage(); y=24; }
  d.setFont("helvetica","normal"); d.text(`${ort||"________"}, den ${fmtDate(dat)}`,20,y); y+=8;
  const toDu=b=>b?blobToDataUrl(b):null; const [a,b]=await Promise.all([toDu(svB),toDu(smB)]);
  (who==="M"?[[b,v.mName,titel==="Mieterselbstauskunft"?"Mietinteressent":"Mieter"]]:who==="V"?[[a,v.vName,titel==="Wohnungsgeberbestätigung"?"Wohnungsgeber":"Vermieter"]]:who==="VM"?[[a,v.vName,"Vermieter"],[b,v.mName,"Mieter"]]:VTPL[Object.keys(VTPL).find(k=>VTPL[k].t===titel)]?.nurMieter?[[b,v.mName,"Mieter"]]:VTPL[Object.keys(VTPL).find(k=>VTPL[k].t===titel)]?.einseitig?[[a,v.vName,titel==="Wohnungsgeberbestätigung"?"Wohnungsgeber":"Vermieter"]]:[[a,v.vName,"Vermieter"],[b,v.mName,"Mieter"]]).forEach(([du,name,rolle],i)=>{ const x=20+i*90; if(du){ try{ d.addImage(du,"PNG",x,y,70,25); }catch(e){} } d.line(x,y+27,x+70,y+27); d.setFontSize(9); d.text(`${name||""} (${rolle})`,x,y+32); });
  d.setFontSize(8); d.setTextColor(120); d.text(`Erstellt mit JoumHome · ${fmtDate(today())}${svB?" · digital unterschrieben":""}`,20,290);
  return d.output("blob");
}

let portalT=null;
function syncPortals(){ if(!isAdmin()||!st.loaded||st.noDb||!st.db) return; clearTimeout(portalT); portalT=setTimeout(syncPortalsNow,1500); }
async function syncPortalsNow(){
  st.portalLast=st.portalLast||{};
  for(const m of list("mieter")){
    if(!m.userId) continue;
    if(m.aktiv===false){ if(st.data.portal?.[m.userId]?.aktiv!==false){ await st.db.collection("portal").doc(m.userId).set({aktiv:false,name:m.name||""}).catch(()=>{}); } continue; }
    const p=buildPortal(m), j=JSON.stringify(p);
    const ex=st.data.portal?.[m.userId]; const exJ=ex?JSON.stringify((({id,stand,aktiv,...r})=>r)(ex)):null;
    if(j===exJ||st.portalLast[m.userId]===j) continue;
    st.portalLast[m.userId]=j;
    await st.db.collection("portal").doc(m.userId).set({...p,aktiv:true,stand:new Date().toISOString()}).catch(e=>console.warn("portal",e));
  }
  await processEingang();
  await syncHwPortalsNow().catch(e=>console.warn("hw",e));
}
let procBusy=false;
async function processEingang(){

    for(const e of list("eingang")){
      const uid=e.id, m=list("mieter").find(x=>x.userId===uid&&x.aktiv!==false); if(!m) continue;
      const w=wohn(m.wohnungId), oid=w?.objektId||"";
      for(const it of (e.items||[])){
        if(!it||!it.id) continue; const did="app-"+it.id;

        const col={schaden:"schaeden",verstoss:"verstoesse",zaehler:"zaehler",garten:"garten",brett:"brett",anfrage:"anfragen",antwort:"nachrichten",kuendigung:"vertraege",dokument:"vertraege"}[it.typ]; if(!col||st.data[col]?.[did]) continue;

        if(it.typ==="zaehler") doc={datum:it.datum||today(),wohnungId:m.wohnungId,art:it.art||"Strom",nummer:it.nummer||"",stand:Number(it.stand)||0,fotoAsset:it.foto||null,notiz:"Vom Mieter über die App gemeldet"};
        if(it.typ==="garten") doc={objektId:oid,wohnungId:m.wohnungId,datum:it.datum,von:it.von,bis:it.bis,anlass:it.anlass||"",status:"Angefragt"};
        if(it.typ==="brett") doc={objektId:oid,vonWohnungId:m.wohnungId,art:it.art||"Sonstiges",datum:today(),text:it.text||"",preis:it.preis??null,wann:it.wann||"",fotoAsset:it.foto||null,status:"Aktiv"};

function openMForm(typ){
  const T=MFORM[typ]; if(!T) return; const p=pm(); const pend={};
  const fh=f=>{ if(f.t==="mwohn"){ const ws=list("wohnungen").filter(w=>w.objektId===myObj()&&w.id!==p?.wohnung?.id); return `<div class="field full"><label for="m_${f.k}">${esc(f.l)}</label><select id="m_${f.k}"><option value="">– weiß ich nicht –</option>${ws.map(w=>`<option value="${esc(w.id)}">${esc(w.lage||w.id)}</option>`).join("")}</select></div>`; }
    return fieldHtml({...f},f.t==="date"?today():(f.t==="bool"?false:null)).replace(/id="f_/g,'id="m_').replace(/for="f_/g,'for="m_'); };
  openSheet(`<div class="spread"><h2>${esc(T.t)}</h2><button class="btn sm ghost" data-act="close">Schließen</button></div>
  <div class="fields">${T.f.map(fh).join("")}</div>

  ${typ==="garten"?`<div class="small">Der Vermieter bestätigt die Reservierung.</div>`:""}
  <div class="row end"><button class="btn" data-act="close">Abbrechen</button><button class="btn pri" id="mSend">Senden</button></div>`);
  for(const f of T.f.filter(f=>f.t==="photo")){ const pick=async inp=>{ const file=inp.files[0]; inp.value=""; if(!file) return; const b=await compress(file); pend[f.k]=b; const box=document.getElementById("m_"+f.k+"_box"); if(box){ let im=box.querySelector("img.thumb"); if(!im){ im=document.createElement("img"); im.className="thumb"; im.alt="Foto"; box.prepend(im); } im.src=URL.createObjectURL(b); } }; ["m_"+f.k,"m_"+f.k+"_cam"].forEach(id=>{ const el=document.getElementById(id); if(el) el.onchange=()=>pick(el); }); }
  $("#mSend").onclick=async()=>{
    const it={typ,datum:today(),...(T.as||{})};
    for(const f of T.f){ if(f.t==="photo") continue; const el=document.getElementById("m_"+f.k); if(!el) continue; let v=f.t==="bool"?el.checked:el.value; if(f.t==="number") v=v===""?null:Number(String(v).replace(",",".")); if(f.req&&(v==null||v==="")){ toast(`Bitte „${f.l}“ ausfüllen`); el.focus(); return; } if(v!==""&&v!=null) it[f.k]=v; }
    if(typ==="garten"&&it.bis<=it.von){ toast("Bitte Zeit prüfen"); return; }
    if(!mOk()) return;
    const b=$("#mSend"); b.disabled=true; b.textContent="Sendet …";
    try{ for(const k in pend) if(st.assets) it[k]=(await st.assets.upload(pend[k])).id; await mSend(it); closeSheet(); toast("Gesendet – der Vermieter wird informiert"); render(); }
    catch(e){ console.error(e); toast("Senden fehlgeschlagen"); b.disabled=false; b.textContent="Senden"; }
  };
}

const fixMonat=f=>(Number(f.betrag)||0)/(FIXINT[f.intervall]||1);
function fixAktiv(f){ const t=today(); return (!f.seit||f.seit<=t)&&(!f.bis||f.bis>=t); }
function cashflow(oid){
  const ws=list("wohnungen").filter(w=>w.objektId===oid);
  const soll=ws.filter(w=>mieterOf(w.id)).reduce((s,w)=>s+sollOf(w.id),0);
  const ym=curYm(), last3=[ymAdd(ym,-1),ymAdd(ym,-2),ymAdd(ym,-3)];
  const ist=last3.reduce((s,m)=>s+list("zahlungen").filter(z=>z.monat===m&&wohn(z.wohnungId)?.objektId===oid).reduce((a,z)=>a+(Number(z.bezahlt)||0),0),0)/3;
  const fx=list("fixkosten").filter(f=>f.objektId===oid&&fixAktiv(f));
  const kosten=fx.reduce((s,f)=>s+fixMonat(f),0);
  const plus=soll-kosten, ratio=soll>0?plus/soll:(kosten>0?-1:0);
  const score=Math.max(0,Math.min(100,Math.round(50+ratio*100)));
  const lvl=score>=80?"Deutlich im Plus":score>=60?"Im Plus":score>=50?"Knapp im Plus":score>=40?"Leicht im Minus":"Im Minus";

}

async function pdfFirstPage(file){

/* ---------- Kauf, AfA & Steuer-Effekt je Objekt (20.11.2026) ---------- */
const KAUF_RENO_KAT=["Reparatur/Handwerker","Material/Baumarkt"];
const KAUF_NK=[["gest","Grunderwerbsteuer €"],["notar","Notar & Grundbuch €"],["makler","Makler €"],["sonstNK","Sonstige Kaufnebenkosten €"]];
const sumB=xs=>xs.reduce((s,a)=>s+(Number(a.betrag)||0),0);
const pctF=n=>(Number(n)||0).toLocaleString("de-DE",{maximumFractionDigits:2})+" %";
const plus3J=s=>{ const [y,m,d]=String(s).slice(0,10).split("-"); return `${Number(y)+3}-${m||"01"}-${d||"01"}`; };
function afaAuto(bj){ bj=Number(bj); if(!bj) return 2; return bj<1925?2.5:(bj>=2023?3:2); }
function kaufBasis(o){
  const k=o?.kauf||{}; const kp=Number(k.kaufpreis)||0; if(!kp) return null;
  const inv=Number(k.inventar)||0; let boden=num(k.bodenwert); const geschaetzt=boden==null;
  if(boden==null) boden=Math.round((kp-inv)*0.2);
  const geb=Math.max(0,kp-inv-boden);
  const nk=KAUF_NK.reduce((s,[f])=>s+(Number(k[f])||0),0);
  const gebAK=geb+(kp-inv>0?nk*geb/(kp-inv):0);
  const auto=num(k.afaSatz)==null||!(Number(k.afaSatz)>0);
  const satz=auto?afaAuto(k.baujahr):Number(k.afaSatz);
  return {k,kp,inv,boden,geschaetzt,geb,nk,gebAK,satz,auto,start:k.uebergabe||k.vertragDatum||""};
}
function afaJahr(b,y){
  if(!b||!b.start||!b.gebAK) return 0; y=Number(y);
  const sy=Number(b.start.slice(0,4)), sm=Number(b.start.slice(5,7))||1; if(!sy||y<sy) return 0;
  const voll=b.gebAK*b.satz/100; let vor=0;
  for(let j=sy;j<y;j++) vor+=(j===sy?voll*(13-sm)/12:voll);
  return Math.max(0,Math.min(b.gebAK-vor,y===sy?voll*(13-sm)/12:voll));
}
function grenze15(oid){
  const b=kaufBasis(st.data.objekte[oid]); if(!b||!b.start||!b.gebAK) return null;
  const ende=plus3J(b.start), lim=b.gebAK*0.15;
  const xs=list("ausgaben").filter(a=>a.objektId===oid&&!isMK(a)&&!a.umlage&&KAUF_RENO_KAT.includes(a.kategorie)&&String(a.datum||"")>=b.start&&String(a.datum||"")<ende);
  const netto=xs.reduce((s,a)=>s+(num(a.mwst)!=null?(Number(a.betrag)||0)-Number(a.mwst):(Number(a.betrag)||0)/1.19),0);
  const r=lim?netto/lim:0;
  return {ende,lim,netto,rest:lim-netto,r,aktiv:today()<ende,lvl:r>1?"bad":(r>=0.8?"warn":"ok"),n:xs.length,geschaetzt:b.geschaetzt};
}
function steuerSatz(){ const s=num(st.cfg?.steuersatz); return s!=null&&s>0?s:null; }
function steuerCalc(oid,y,nur){
  const o=st.data.objekte[oid]; const b=kaufBasis(o); y=String(y); const ty=today().slice(0,4);
  let ein=list("zahlungen").filter(z=>String(z.monat).startsWith(y)&&wohn(z.wohnungId)?.objektId===oid).reduce((s,z)=>s+(Number(z.bezahlt)||0),0), einGesch=false;
  if(!ein){
    const soll=list("wohnungen").filter(w=>w.objektId===oid&&mieterOf(w.id)).reduce((s,w)=>s+sollOf(w.id),0);
    let m=y<ty?12:(y===ty?Number(today().slice(5,7)):0);
    if(b?.start){ const sy=b.start.slice(0,4); if(sy>y) m=0; else if(sy===y) m=Math.max(0,m-(Number(b.start.slice(5,7))-1)); }

  const vm=as.filter(a=>!isMK(a)), k=sumB(vm), u=sumB(vm.filter(a=>a.umlage)), nu=k-u, er=sumB(as.filter(a=>isMK(a)&&a.erstattet));

}

/* PDF -> Seitenbilder */
async function loadPdfJs(){
  if(!window.pdfjsLib){ await new Promise(res=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; s.onload=res; s.onerror=res; document.head.appendChild(s); setTimeout(res,8000); }); if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  return !!window.pdfjsLib;
}
async function pdfPages(file,max=20){
  if(!await loadPdfJs()) return [];
  try{ const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const out=[];
    for(let i=1;i<=Math.min(doc.numPages,max);i++){ const pg=await doc.getPage(i); const vp=pg.getViewport({scale:1.4}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.8))); }
    return out; }catch(e){ console.warn(e); return []; }
}
function normAdr(s){ return String(s||"").split(",")[0].toLowerCase().replace(/ß/g,"ss").replace(/strasse|straße|str\./g,"str").replace(/[^a-z0-9äöü]/g,""); }
function matchObj(adr){ const a=normAdr(adr); if(!a) return ""; const o=list("objekte").find(o=>{ const b=normAdr(o.adresse); return b&&(a.includes(b)||b.includes(a)); }); return o?.id||""; }
const isPlatzhalter=o=>!o.adresse||/platzhalter|^(objekt|haus|o)\s*\d+$/i.test(String(o.name||"").trim());

  const n=Object.values(pre).filter(x=>x!=null&&x!=="").length;

const EK_PERS_F=[["brutto","Bruttoarbeitslohn (Zeile 3)"],["lst","Lohnsteuer einbehalten (Zeile 4)"],["soli","Soli einbehalten (Zeile 5)"],["kist","Kirchensteuer einbehalten (Zeile 6/7)"],["rv","Rentenversicherung Arbeitnehmer (Zeile 23a)"],["kv","Krankenversicherung Arbeitnehmer (Zeile 25)"],["pv","Pflegeversicherung Arbeitnehmer (Zeile 26)"],["av","Arbeitslosenversicherung Arbeitnehmer (Zeile 27)"],["wk","Werbungskosten Job (Fahrten, Homeoffice …; leer = Pauschbetrag 1.230 €)"]];
const EK_SIT=["Angestellt (Vollzeit)","Angestellt (Teilzeit / Minijob)","Selbständig / Gewerbe","Nur Vermietung / Rente"];
function tarifESt(zve,y){
  zve=Math.floor(Math.max(0,zve)); y=Number(y);
  const T=y>=2026?{g:12348,a:17799,b:69878,c:277825,k2:914.51,k3:173.10,c3:1034.87,d4:11135.63,d5:19470.38}:{g:12096,a:17443,b:68480,c:277825,k2:932.30,k3:176.64,c3:1015.13,d4:10911.92,d5:19246.67};
  if(zve<=T.g) return 0;
  if(zve<=T.a){ const q=(zve-T.g)/1e4; return Math.floor((T.k2*q+1400)*q); }
  if(zve<=T.b){ const q=(zve-T.a)/1e4; return Math.floor((T.k3*q+2397)*q+T.c3); }
  if(zve<=T.c) return Math.floor(0.42*zve-T.d4);
  return Math.floor(0.45*zve-T.d5);
}
function steuerGes(zve,y,zus,kirche){
  const est=zus?2*tarifESt(zve/2,y):tarifESt(zve,y);
  const fg=(Number(y)>=2026?20350:19950)*(zus?2:1);
  const soli=est<=fg?0:Math.min(est*0.055,(est-fg)*0.119);
  const kist=kirche?est*0.09:0;
  return {est,soli,kist,sum:est+soli+kist};
}
const ekJahr=y=>(st.eink||{})[String(y)]||null;
function ekHat(y){ const e=ekJahr(y); if(!e) return false; return ["ich","partner"].some(p=>Number(e[p]?.brutto)>0)||Number(e.sonstige)>0||e.situation===EK_SIT[3]; }
function ekPers(p){ p=p||{}; const n=k=>Number(p[k])||0;
  const brutto=n("brutto"); const wk=brutto?Math.max(1230,n("wk")):0; const eink=Math.max(0,brutto-wk);
  const basis=n("kv")*0.96+n("pv"); const av=Math.max(0,Math.min(n("av"),1900-basis));
  return {brutto,wk,eink,vorsorge:n("rv")+basis+av,einbeh:n("lst")+n("soli")+n("kist"),kist:n("kist")}; }
function vvSumme(y){ return list("objekte").reduce((s,o)=>s+steuerCalc(o.id,y,true).erg,0); }
function ekBasis(y){
  const e=ekJahr(y); if(!ekHat(y)) return null; y=String(y);
  const zus=e.veranlagung==="zusammen", kirche=!!e.kirche;
  const a=ekPers(e.ich), b=zus?ekPers(e.partner):ekPers({});
  const vv=vvSumme(y), sonst=Number(e.sonstige)||0;
  const sa=(zus?72:36)+(Number(e.sonderausgaben)||0)+a.kist+b.kist;
  const ohneVV=Math.max(0,a.eink+b.eink+sonst-a.vorsorge-b.vorsorge-sa);
  const zve=Math.max(0,ohneVV+vv);
  const mit=steuerGes(zve,y,zus,kirche), ohne=steuerGes(ohneVV,y,zus,kirche);
  const einbeh=a.einbeh+b.einbeh;
  const grenz=(steuerGes(zve+100,y,zus,kirche).sum-mit.sum);
  return {e,y,zus,kirche,a,b,vv,sonst,sa,ohneVV,zve,mit,ohne,effekt:ohne.sum-mit.sum,einbeh,erstattung:einbeh-mit.sum,grenz,hoch:!!(e.ich?.hoch||e.partner?.hoch)};
}

function ekDelta(y,abzug){ const B=ekBasis(y); if(!B) return null; return steuerGes(B.zve+abzug,y,B.zus,B.kirche).sum-B.mit.sum; }

function openChat(){
  if(!st.sample){ toast("Die KI ist in dieser Ansicht nicht verfügbar"); return; }
  openSheet(chatHtml());
  const t=$("#chatTxt"); if(t) t.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendChat(); } });
  const sh=$("#sheet"); sh.scrollTop=sh.scrollHeight;
}
let chatBusy=false;
async function sendChat(){
  const t=$("#chatTxt"); if(!t||chatBusy) return; if(st.dict&&st.dict.active()) await st.dict.stop().catch(()=>{});
  const q=t.value.trim(); if(!q) return;
  if(!await nutzen("ki")){ paketSperre("ki"); return; } t.value="";
  st.chat.push({role:"user",content:q}); chatBusy=true;
  const log=$("#chatLog"); $("#sheet .chips")?.remove();
  log.insertAdjacentHTML("beforeend",`<div class="msg u">${esc(q)}</div><div class="msg a" id="chatLive"><span class="spin" style="display:inline-block"></span></div>`);
  const live=$("#chatLive"), sh=$("#sheet"); sh.scrollTop=sh.scrollHeight;
  const turns=[{role:"user",content:aiRules()},{role:"assistant",content:"Verstanden."},...st.chat.slice(-12)];
  try{
    const {text}=await st.sample(turns,{cache:false,onText:({text})=>{ live.textContent=text; sh.scrollTop=sh.scrollHeight; }});
    live.textContent=text; live.removeAttribute("id"); st.chat.push({role:"assistant",content:text});
    if(st.chatSpeak&&st.tts) say(text.replace(/[*#_`]/g,""));
  }catch(e){
    const m={not_granted:"Die KI wurde nicht erlaubt.",rate_limited:"Die KI ist gerade ausgelastet – bitte gleich noch einmal versuchen.",refused:"Dazu kann ich nichts sagen."};
    live.textContent=(e?.text?e.text+"\n\n":"")+(m[e?.code]||"Die Antwort ist fehlgeschlagen – bitte noch einmal versuchen."); live.removeAttribute("id"); st.chat.pop();
  }
  chatBusy=false; sh.scrollTop=sh.scrollHeight;
}

function localQuad(img){
  const S=320, k=Math.min(1,S/Math.max(img.width,img.height)), W=Math.max(8,Math.round(img.width*k)), H=Math.max(8,Math.round(img.height*k));
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(img,0,0,W,H);

  for(let i=0;i<W*H;i++){ const v=(d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114)|0; L[i]=v; hist[v]++; }
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i]; let sB=0,wB=0,best=0,th=128; const N=W*H;
  for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=N-wB; if(!wF) break; sB+=t*hist[t]; const mB=sB/wB,mF=(sum-sB)/wF, v=wB*wF*(mB-mF)*(mB-mF); if(v>best){best=v;th=t;} }
  const lab=new Int32Array(N).fill(-1); let bestC=null;
  for(let s=0;s<N;s++){ if(lab[s]!==-1||L[s]<=th) continue; const q=[s]; lab[s]=s; const pts=[]; while(q.length){ const p=q.pop(); pts.push(p); const x=p%W,y=(p/W)|0; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue; const n=ny*W+nx; if(lab[n]===-1&&L[n]>th){ lab[n]=s; q.push(n); } } } if(!bestC||pts.length>bestC.length) bestC=pts; }
  if(!bestC) return null; const frac=bestC.length/N; if(frac<0.06||frac>0.96) return null;
  const P=bestC.map(p=>[p%W,(p/W)|0]);
  const pick=(f,max)=>P.reduce((a,b)=>(max?f(b)>f(a):f(b)<f(a))?b:a);
  const qa=[pick(p=>p[0]+p[1],0),pick(p=>p[0]-p[1],1),pick(p=>p[0]+p[1],1),pick(p=>p[0]-p[1],0)];
  const qb=[pick(p=>p[1],0),pick(p=>p[0],1),pick(p=>p[1],1),pick(p=>p[0],0)];
  const area=q=>Math.abs(q.reduce((s,p,i)=>{const n=q[(i+1)%4]; return s+p[0]*n[1]-n[0]*p[1];},0))/2;
  const quad=area(qa)>=area(qb)?qa:qb, A=area(quad); if(A<1||bestC.length/A<0.82) return null;

function homography(src,dst){ // maps dst -> src
  const A=[],b=[]; for(let i=0;i<4;i++){ const [x,y]=dst[i],[u,v]=src[i]; A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
  for(let c=0;c<8;c++){ let m=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[m][c])) m=r; [A[c],A[m]]=[A[m],A[c]]; [b[c],b[m]]=[b[m],b[c]]; const p=A[c][c]||1e-12; for(let r=0;r<8;r++){ if(r===c) continue; const f=A[r][c]/p; if(!f) continue; for(let k=c;k<8;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; } }
  return b.map((v,i)=>v/A[i][i]).concat(1);
}
function warpDoc(img,q){ // q: 4 Punkte in Bildpixeln, Reihenfolge oben-links, oben-rechts, unten-rechts, unten-links (Leserichtung)
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let w=Math.max(dist(q[0],q[1]),dist(q[3],q[2])), h=Math.max(dist(q[0],q[3]),dist(q[1],q[2]));
  const s=Math.min(1,2000/Math.max(w,h)); w=Math.max(40,Math.round(w*s)); h=Math.max(40,Math.round(h*s));
  const sc=document.createElement("canvas"); sc.width=img.width; sc.height=img.height; const sg=sc.getContext("2d",{willReadFrequently:true}); sg.drawImage(img,0,0);
  const sd=sg.getImageData(0,0,img.width,img.height).data, SW=img.width, SH=img.height;
  const M=homography(q,[[0,0],[w,0],[w,h],[0,h]]);
  const oc=document.createElement("canvas"); oc.width=w; oc.height=h; const og=oc.getContext("2d"); const od=og.createImageData(w,h), o=od.data;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const z=M[6]*x+M[7]*y+1, u=(M[0]*x+M[1]*y+M[2])/z, v=(M[3]*x+M[4]*y+M[5])/z;
    const x0=Math.floor(u), y0=Math.floor(v), fx=u-x0, fy=v-y0, i=(y*w+x)*4;
    if(x0<0||y0<0||x0>=SW-1||y0>=SH-1){ o[i]=o[i+1]=o[i+2]=255; o[i+3]=255; continue; }
    const a=(y0*SW+x0)*4, b=a+4, c=a+SW*4, d=c+4;
    for(let ch=0;ch<3;ch++) o[i+ch]=(sd[a+ch]*(1-fx)+sd[b+ch]*fx)*(1-fy)+(sd[c+ch]*(1-fx)+sd[d+ch]*fx)*fy;
    o[i+3]=255;

  // Kontrast: 2 %–98 % Helligkeit auf volle Spanne
  const hist=new Array(256).fill(0); for(let i=0;i<o.length;i+=4) hist[(o[i]*0.299+o[i+1]*0.587+o[i+2]*0.114)|0]++;
  const N=w*h; let acc=0,lo=0,hi=255; for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>N*0.02){lo=i;break;} } acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>N*0.02){hi=i;break;} }
  if(hi-lo>40){ const f=255/(hi-lo); for(let i=0;i<o.length;i+=4) for(let ch=0;ch<3;ch++) o[i+ch]=Math.max(0,Math.min(255,(o[i+ch]-lo)*f)); }

async function docFix(file){

    let ai=null;

      if(loc){ // genaue lokale Ecken in KI-Reihenfolge bringen
        const used=new Set(); const m=E.map(p=>{ let bi=-1,bd=9; loc.forEach((l,i)=>{ if(used.has(i)) return; const d=Math.hypot(l[0]-p[0],l[1]-p[1]); if(d<bd){bd=d;bi=i;} }); used.add(bi); return {i:bi,d:bd}; });
        const cyc=m.map(x=>x.i), okCyc=[0,1,2,3].some(s=>cyc.every((v,j)=>v===(s+j)%4));
        q=okCyc&&m.every(x=>x.d<0.18)?cyc.map(i=>loc[i]):E;
      } else q=E;
    } else if(loc){ q=loc; rot=[0,90,180,270].includes(ai?.drehung)?ai.drehung:0; }
    if(!q) return {blob:small,changed:false};
    const cx=q.reduce((s,p)=>s+p[0],0)/4, cy=q.reduce((s,p)=>s+p[1],0)/4;
    const px=q.map(p=>[(cx+(p[0]-cx)*1.015)*W,(cy+(p[1]-cy)*1.015)*H].map((v,i)=>Math.max(0,Math.min(i?H-1:W-1,v))));
    let c=warpDoc(img,px); if(rot) c=rotateCanvas(c,-rot);
    return {blob:await canvasBlob(c),changed:true,orig:small};
  }catch(e){ console.warn("docFix",e); return {blob:file,changed:false}; }
}

function scanPages({multi=false,title="Scannen",tip=""}={}){
  return new Promise(res=>{
    const pages=[]; let done=false;
    const fin=v=>{ if(done) return; done=true; SCAN_RES=null; pages.forEach(p=>p.u&&URL.revokeObjectURL(p.u)); res(v); };
    openSheet(`<div class="spread"><h2>${esc(title)}</h2><button class="btn sm ghost" id="scX">Abbrechen</button></div>
    ${tip?`<div class="small">${esc(tip)}</div>`:""}
    <div class="scan-strip${multi?"":" one"}" id="scStrip"></div>
    <label class="btn ${multi?"pri":"pri"} scan-cam" for="scCam" id="scCamB">${CAMSVG}<span id="scCamL">Kamera öffnen</span></label>
    <input id="scCam" class="hide" type="file" accept="image/*" capture="environment">
    <div class="row" style="justify-content:space-between;align-items:center"><label class="btn sm ghost" for="scGal">Aus Galerie / Dateien wählen</label><input id="scGal" class="hide" type="file" accept="image/*"${multi?" multiple":""}>
    <button class="btn pri" id="scDone" disabled>${multi?"Fertig":"Übernehmen"}</button></div>
    <div class="small">Wird automatisch gerade gerückt, zugeschnitten und gedreht. Tipp: Dokument auf einen dunklen Untergrund legen, gutes Licht.</div>`);
    SCAN_RES=()=>fin([]);
    const busy=()=>pages.some(p=>p.busy);
    const paint=()=>{ const el=$("#scStrip"); if(!el) return;
      el.innerHTML=pages.map((p,i)=>`<div class="sp${p.busy?" busy":""}">${p.u?`<img src="${p.u}" alt="Seite ${i+1}">`:""}${p.busy?`<div class="spin-w"><div class="spin"></div><small>wird gerade gerückt …</small></div>`:""}<span>${multi?i+1:(p.changed?"✓ ausgerichtet":"Original")}</span>${p.busy?"":`<button class="rb rot" data-rot="${i}" aria-label="Drehen">↻</button>${p.orig?`<button class="rb org" data-org="${i}" aria-label="Original">${p.useOrig?"Auto":"Orig."}</button>`:""}`}<button class="rb del" data-del="${i}" aria-label="Seite entfernen">×</button></div>`).join("");
      el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const [p]=pages.splice(+b.dataset.del,1); p.u&&URL.revokeObjectURL(p.u); paint(); });
      el.querySelectorAll("[data-rot]").forEach(b=>b.onclick=async()=>{ const p=pages[+b.dataset.rot]; p.busy=true; paint(); p.cur=await rotateBlob(p.cur,90); if(p.u) URL.revokeObjectURL(p.u); p.u=URL.createObjectURL(p.cur); p.busy=false; paint(); });
      el.querySelectorAll("[data-org]").forEach(b=>b.onclick=()=>{ const p=pages[+b.dataset.org]; p.useOrig=!p.useOrig; [p.cur,p.alt]=[p.alt,p.cur]; if(p.u) URL.revokeObjectURL(p.u); p.u=URL.createObjectURL(p.cur); paint(); });
      const d=$("#scDone"); d.disabled=!pages.length||busy();
      if(multi){ $("#scCamL").textContent=pages.length?`Seite ${pages.length+1} fotografieren`:"Kamera öffnen"; d.textContent=pages.length?`Fertig (${pages.length} ${pages.length>1?"Seiten":"Seite"})`:"Fertig"; }
      else { $("#scCamL").textContent=pages.length?"Neu fotografieren":"Kamera öffnen"; $("#scCamB").classList.toggle("pri",!pages.length); }
    };
    const add=fs=>{ if(!multi){ pages.forEach(p=>p.u&&URL.revokeObjectURL(p.u)); pages.length=0; fs=fs.slice(0,1); }
      for(const f of fs){ const p={busy:true,cur:f,u:URL.createObjectURL(f)}; pages.push(p);
        docFix(f).then(r=>{ if(done) return; p.cur=r.blob; p.changed=r.changed; if(r.changed){ p.orig=true; p.alt=r.orig; } URL.revokeObjectURL(p.u); p.u=URL.createObjectURL(p.cur); p.busy=false; paint(); }); }
      paint(); };
    $("#scCam").onchange=e=>{ add([...e.target.files]); e.target.value=""; };
    $("#scGal").onchange=e=>{ add([...e.target.files]); e.target.value=""; };
    $("#scX").onclick=()=>closeSheet();
    $("#scDone").onclick=()=>{ if(busy()) return; const out=pages.map(p=>p.cur); closeSheet(); fin(out); };
  });
}

async function compress(file,max=1600){
  try{
    const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.82));
  }catch(e){ return file; }
}
const blobToDataUrl = b => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
async function imagesToPdf(blobs){
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:"mm",format:"a4"});
  for(let i=0;i<blobs.length;i++){
    const du=await blobToDataUrl(blobs[i]); const img=new Image(); img.src=du; await img.decode();
    const W=190,H=277, r=Math.min(W/img.naturalWidth,H/img.naturalHeight); const w=img.naturalWidth*r,h=img.naturalHeight*r;
    if(i) d.addPage(); d.addImage(du,"JPEG",10+(W-w)/2,10+(H-h)/2,w,h);
  }
  return d.output("blob");
}

const GW_KEYS=[["Heizung",/heiz|heizkörper|therme|warmwasser|boiler|kalt in der wohnung|brenner|thermostat/i],["Sanitär",/wasser|rohr|abfluss|verstopf|wc\b|toilette|klo|spül|dusche|wanne|waschbecken|wasserhahn|armatur|tropf|undicht|leck|feucht|nass/i],["Elektro",/strom|steckdose|sicherung|licht|lampe|kabel|schalter|elektr|fi-schalter|klingel|herd geht/i],["Fenster/Türen",/fenster|tür|rollladen|rolladen|jalousie|griff|scharnier|glas/i],["Schlüsseldienst",/schloss|schlüssel|ausgesperrt|zylinder/i],["Maler/Tapezierer",/schimmel|tapete|wand|decke|farbe|riss/i],["Dachdecker",/dach|regenrinne|ziegel/i],["Fliesenleger",/fliese|fuge/i],["Bodenleger",/boden|laminat|parkett|teppich/i],["Schädlingsbekämpfung",/maus|mäuse|ratte|kakerlak|schabe|ungeziefer|wespe|bettwanze|motte/i],["Garten/Landschaft",/garten|baum|hecke|rasen/i],["Schornsteinfeger",/schornstein|kamin/i]];
function hwGewerk(d){ const t=[d?.beschreibung,d?.notiz,d?.art].filter(Boolean).join(" "); for(const [g,re] of GW_KEYS) if(re.test(t)) return g; return ""; }
function hwNeed(col,d){
  if(col!=="schaeden"||!d) return null;
  const as=list("auftraege").filter(a=>!isAnw(a)&&a.ticketCol===col&&a.ticketId===d.id);
  const open=as.find(awOpenSt);
  if(open) return {state:open.status==="Problem"?"problem":open.status==="Fertig gemeldet"?"fertig":"busy",a:open,gewerk:open.gewerk||hwGewerk(d)};
  if(d.status==="Erledigt") return null;
  if(as.some(a=>a.status==="Erledigt")) return null;
  return {state:"need",gewerk:hwGewerk(d)};
}
function hwBadge(col,d){
  if(!isAdmin()) return ""; const n=hwNeed(col,d); if(!n) return "";
  if(n.state==="busy") return `<button class="hwb busy" data-act="awOpen" data-id="${esc(n.a.id)}" aria-label="Handwerker beauftragt" title="Handwerker beauftragt: ${esc(n.a.hwName)}">${IC_HAM}</button>`;
  if(n.state==="fertig") return `<button class="hwb done" data-act="awOpen" data-id="${esc(n.a.id)}" aria-label="Handwerker hat erledigt gemeldet" title="${esc(n.a.hwName)} hat die Arbeit als erledigt gemeldet – bitte prüfen">${IC_OK}</button>`;
  if(n.state==="problem") return `<button class="hwb prob" data-act="awOpen" data-id="${esc(n.a.id)}" aria-label="Handwerker meldet Problem" title="${esc(n.a.hwName)}: ${esc(n.a.hwProblem||"Problem")}">${IC_WARN}</button>`;
  return `<button class="hwb" data-act="awNew" data-tcol="${col}" data-tid="${esc(d.id)}" data-g="${esc(n.gewerk)}" aria-label="Handwerker nötig" title="Handwerker nötig${n.gewerk?": "+esc(n.gewerk):""} – tippen zum Beauftragen">${IC_HAM}</button>`;
}

function awText(v){
  const o=st.data.objekte[v.objektId], w=v.wohnungId?wohn(v.wohnungId):null, me=st.cfg||{};
  const adr=(o?.adresse&&o?.name&&o.adresse.includes(o.name)?o.adresse:[o?.name,o?.adresse].filter(Boolean).join(", "))||objName(v.objektId);
  const sig=["","Viele Grüße"]; if(me.name) sig.push(me.name); if(me.adresse) sig.push(me.adresse); if(me.telefon) sig.push(`Tel. ${me.telefon}`); if(me.email) sig.push(me.email);
  if(v.typ==="Anwalt"){
    const L=[`Sehr geehrte${v.name?"/r "+v.name:" Damen und Herren"},`,"","ich möchte Sie mit folgender Angelegenheit beauftragen:","",`Betreff: ${v.titel||""}`,`Mietobjekt: ${adr}${w?` – Wohnung ${w.lage||w.id}`:""}`];
    if(v.gegner) L.push(`Mieter (Gegenseite): ${v.gegner}`);
    if(v.text) L.push("",v.text);
    if(v.termin) L.push("",`Bitte um Rückmeldung bis: ${v.termin}`);
    if(v.nDocs) L.push("",`Die Unterlagen (${v.nDocs} Datei${v.nDocs>1?"en":""}: Mahnungen, Mietvertrag u. a.) sende ich Ihnen direkt mit.`);
    L.push("","Bitte bestätigen Sie mir die Übernahme des Mandats und teilen Sie mir mit, welche Unterlagen Sie noch benötigen.",...sig);
    return L.join("\n");
  }
  const L=[`Hallo ${v.name||""},`.replace(" ,",","),"",`ich habe folgenden Auftrag für Sie${v.prio==="Dringend"?" – es ist DRINGEND":""}:`,"",`Was: ${v.titel||""}`,`Wo: ${adr}${w?` – Wohnung ${w.lage||w.id}`:""}`];
  if(adr&&st.data.objekte[v.objektId]?.adresse) L.push(`Navigation: ${navG(adr)}`);
  if(v.ticketNr) L.push(`Vorgang: ${v.ticketNr}`);
  if(v.text) L.push("",v.text);
  if(v.termin) L.push("",`Wunschtermin: ${v.termin}`);
  if(v.mk) L.push(`Ansprechpartner vor Ort: ${v.mk.name}${v.mk.telefon?`, Tel. ${v.mk.telefon}`:""}`);
  if(v.nFotos) L.push("",`${v.nFotos} Foto${v.nFotos>1?"s":""} vom Schaden schicke ich Ihnen direkt mit.`);
  if(v.hasApp) L.push("","Alle Details mit Standort und Navigation finden Sie auch in der JoumHome-App. Wenn die Arbeit erledigt ist, melden Sie das dort bitte mit einem Foto.");
  L.push("","Bitte bestätigen Sie mir kurz den Auftrag und nennen Sie mir einen Termin. Danke!",...sig);
  return L.join("\n");
}
function anwFallText(m){
  const P=forderungen(m), sum=P.reduce((s,p)=>s+p.betrag,0), ms=list("mahnungen").filter(x=>x.mieterId===m.id&&x.versendet).sort((a,b)=>String(a.datum).localeCompare(String(b.datum)));
  const L=[`Mieter: ${m.name}${m.beginn?`, Mietbeginn ${fmtDate(m.beginn)}`:""}`,`Anschrift: ${addrLines(m).slice(1).join(", ")}`];
  if(m.telefon) L.push(`Telefon Mieter: ${m.telefon}`); if(m.email) L.push(`E-Mail Mieter: ${m.email}`);
  L.push("","Offene Forderungen:",...P.map(p=>`– ${p.text}: ${eur(p.betrag)}`),`Gesamt: ${eur(sum)}`);
  if(ms.length) L.push("","Bisherige Mahnungen:",...ms.map(x=>`– ${x.stufe}. Mahnung vom ${fmtDate(x.datum)} über ${eur(x.summe)}, Frist bis ${fmtDate(x.frist)}, versendet am ${fmtDate(x.versendet)}${x.kanal?.length?` (${x.kanal.join(", ")})`:""}`));
  L.push("","Bis heute ist keine (vollständige) Zahlung eingegangen.");
  return L.join("\n");
}

/* ---------- Forderungen & Mahnungen ---------- */
const r2=n=>Math.round(n*100)/100;
function forderungen(m){
  if(!m) return []; const P=[], from=(m.beginn||"").slice(0,7), t=today();
  list("zahlungen").filter(z=>z.wohnungId===m.wohnungId&&(!from||z.monat>=from)&&`${z.monat}-03`<t&&["Offen","Teilzahlung"].includes(zStatus(z))).sort((a,b)=>a.monat.localeCompare(b.monat))
    .forEach(z=>{ const b=(Number(z.soll)||sollOf(z.wohnungId))-(Number(z.bezahlt)||0); if(b>0.004) P.push({k:"z:"+z.id,art:"Miete",text:`Miete ${fmtYm(z.monat,"de")}${Number(z.bezahlt)?" (Rest)":""}`,betrag:r2(b)}); });
  const kOff=(Number(m.kaution)||0)-(Number(m.kautionGezahlt)||0); if(Number(m.kaution)&&kOff>0.004) P.push({k:"kaution",art:"Kaution",text:"Mietkaution (offener Rest)",betrag:r2(kOff)});
  list("ausgaben").filter(a=>isMK(a)&&!a.erstattet&&a.wohnungId===m.wohnungId&&(!m.beginn||!a.datum||String(a.datum)>=m.beginn)).sort((a,b)=>String(a.datum).localeCompare(String(b.datum)))
    .forEach(a=>{ const tk=a.ticketId&&st.data[a.ticketCol]?.[a.ticketId]; P.push({k:"a:"+a.id,art:"Kosten",text:`${tk?`Kosten zu Vorgang ${tNr(tk)}`:"Kosten"}: ${a.beschreibung||a.kategorie||""} (${fmtDate(a.datum)})`.slice(0,140),betrag:r2(Number(a.betrag)||0)}); });
  return P;
}
function mahnInfo(m){
  const ms=list("mahnungen").filter(x=>x.mieterId===m.id).sort((a,b)=>String(a.datum).localeCompare(String(b.datum))||(a.stufe||0)-(b.stufe||0));
  const akt=ms.filter(x=>["Erstellt","Versendet"].includes(x.status)), anw=ms.some(x=>x.status==="An Anwalt"&&!x.erledigt);
  const last=akt[akt.length-1]||null, stufe=last?Number(last.stufe)||1:0, offen=forderungen(m).reduce((s,p)=>s+p.betrag,0);

function mhPdf({m,betreff,body,sigDu}){
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:"mm",format:"a4"}); const c=st.cfg||{};
  if(st.logoDu){ try{ d.addImage(st.logoDu,"PNG",170,14,18,20.6); }catch(e){} }
  d.setFont("helvetica","normal"); d.setFontSize(8.5); d.setTextColor(90);
  d.text([c.name,c.adresse].filter(Boolean).join(" · ")||"Absender im Profil eintragen",20,40);
  d.setTextColor(0); d.setFontSize(11); d.text(addrLines(m),20,48);
  d.text(`${c.ort||""}${c.ort?", ":""}${fmtDate(today())}`,190,80,{align:"right"});
  d.setFont("helvetica","bold"); const bl=d.splitTextToSize(betreff,170); d.text(bl,20,92); d.setFont("helvetica","normal");
  const LH=11*0.3528*1.4; let y=92+bl.length*LH+6;
  const foot=()=>{ const contact=[c.telefon,c.email].filter(Boolean).join(" · "); d.setFontSize(8.5); d.setTextColor(90); if(contact) d.text(contact,20,285); d.setFontSize(11); d.setTextColor(0); };
  for(const ln of d.splitTextToSize(body+"\n\nMit freundlichen Grüßen",170)){ if(y>270){ foot(); d.addPage(); y=25; } d.text(ln,20,y); y+=LH; }
  if(y+26>275){ foot(); d.addPage(); y=25; }
  if(sigDu){ try{ d.addImage(sigDu,"PNG",20,y,55,20); }catch(e){} } y+=22; d.setDrawColor(150); d.line(20,y,85,y); y+=5; d.text(c.name||"",20,y);
  foot(); return d.output("blob");
}

async function hwApply(a,it,von){

  if(it.typ==="problem"){ line=`${von}: Kann nicht erledigt werden – ${txt||"ohne Begründung"}${fotos.length?` (${fotos.length} Foto${fotos.length>1?"s":""})`:""}`; ex.status="Problem"; ex.hwProblem=txt; }

let S_RES=[];
function sRun(q){
  const box=$("#sres"); if(!box) return; const toks=nrm(q).split(/\s+/).filter(Boolean);
  if(!toks.length){ box.classList.add("hide"); box.innerHTML=""; return; }
  const all=sIndex().filter(r=>toks.every(t=>r.k.includes(t)));
  all.forEach(r=>{ r.sc=(r.tn.startsWith(toks[0])?3:0)+(toks.every(t=>r.tn.includes(t))?2:0)+(r.g==="Funktionen"?0.5:0); });
  all.sort((a,b)=>b.sc-a.sc);
  const by={}, order=[]; for(const r of all){ if(!by[r.g]){ by[r.g]=[]; order.push(r.g); } if(by[r.g].length<6) by[r.g].push(r); }
  order.sort((a,b)=>by[b][0].sc-by[a][0].sc);
  S_RES=[]; let html="";
  for(const g of order){ html+=`<div class="sg">${esc(g)}</div>`; for(const r of by[g]){ const i=S_RES.push(r)-1; html+=`<button class="sr" data-si="${i}"><b>${esc(r.t)}</b>${r.s?`<small>${esc(r.s)}</small>`:""}</button>`; } }
  box.innerHTML=html||`<div class="small" style="padding:12px">Nichts gefunden für „${esc(q)}“.</div>`; box.classList.remove("hide");
  box.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>{ const r=S_RES[+b.dataset.si]; box.classList.add("hide"); $("#sq").blur(); try{ r.run(); }catch(e){ console.error(e); } });
}

function sigPad(cv){
  const ctx=cv.getContext("2d"); const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#ece6d8"; let draw=false; const strokes=[];
  const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  cv.onpointerdown=e=>{ draw=true; cv.setPointerCapture(e.pointerId); const p=pt(e); strokes.push([p]); ctx.beginPath(); ctx.moveTo(p[0],p[1]); };
  cv.onpointermove=e=>{ if(!draw) return; const p=pt(e); strokes[strokes.length-1].push(p); ctx.lineTo(p[0],p[1]); ctx.stroke(); };
  cv.onpointerup=cv.onpointercancel=()=>{ draw=false; };
  return { used:()=>strokes.length>0, clear:()=>{ ctx.clearRect(0,0,cv.width,cv.height); strokes.length=0; },
    blob:()=>new Promise(res=>{ const c2=document.createElement("canvas"); c2.width=cv.width; c2.height=cv.height; const x=c2.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c2.width,c2.height); x.scale(dpr,dpr); x.strokeStyle="#141414"; x.lineWidth=2.4; x.lineCap="round"; x.lineJoin="round";
      for(const st2 of strokes){ x.beginPath(); x.moveTo(st2[0][0],st2[0][1]); for(const p of st2.slice(1)) x.lineTo(p[0],p[1]); if(st2.length===1) x.lineTo(st2[0][0]+0.5,st2[0][1]); x.stroke(); }
      c2.toBlob(res,"image/png"); }) };
}

async function umzugExport(){
  const stEl=$("#umSt"), set=t=>{ if(stEl) stEl.textContent=t; };
  try{
    set("ZIP-Werkzeug wird geladen …");
    if(!window.JSZip) await new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
    const zip=new JSZip(), daten={}; for(const c of COLS) daten[c]=Object.values(st.data[c]||{});
    const config={vermieter:st.cfg||{},bank:st.bank||{},einkommen:st.eink||{}};
    const ids=new Set(); const ok=v=>v.length>=6&&v.length<=150&&!/^(data:|https?:|blob:)/.test(v)&&!/\s/.test(v);
    const walk=(v,k)=>{ if(typeof v==="string"){ if(/asset|foto|bild|beleg|pdf|dok|video|datei|cover|scan/i.test(k||"")&&ok(v)) ids.add(v); } else if(Array.isArray(v)) v.forEach(x=>walk(x,k)); else if(v&&typeof v==="object") Object.entries(v).forEach(([kk,x])=>walk(x,kk)); };
    walk(daten); walk(config);
    const meta={}; let n=0, gut=0;
    for(const id of ids){ n++; set(`Fotos und Dateien ${n} von ${ids.size} …`); try{ const r=await fetch(assetUrl(id)); if(!r.ok) continue; const ct=r.headers.get("content-type")||""; if(ct.includes("text/html")) continue; const b=await r.blob(); zip.file("dateien/"+encodeURIComponent(id),b); meta[id]=b.type||ct; gut++; }catch(e){} }
    zip.file("daten.json",JSON.stringify({app:"JoumHome",version:2,exportiert:new Date().toISOString(),daten,config,dateien:meta}));
    set("ZIP wird gepackt …"); const blob=await zip.generateAsync({type:"blob"});
    await saveFile(`JoumHome-Umzug_${today()}.zip`,blob); set(`Fertig: ${Object.values(daten).reduce((s,x)=>s+x.length,0)} Einträge, ${gut} Dateien, ${(blob.size/1048576).toFixed(1)} MB.`); toast("Umzug-Datei erstellt");
  }catch(e){ console.error(e); set("Fehlgeschlagen – bitte erneut versuchen."); }
}

      st.seen.add(c); if(st.seen.size>=COLS_RUN.length && !st.loaded){ st.loaded=true; clearTimeout(timer); }
      later();
    },err=>{ console.error(c,err); st.seen.add(c); if(st.seen.size>=COLS_RUN.length){ st.loaded=true; clearTimeout(timer);} later(); });
  }
  if(st.role==="mieter") return;
  db.doc("config/bank").onSnapshot(s=>{ st.bank=s.exists?s.data():{}; later(); },()=>{});
  db.doc("config/vermieter").onSnapshot(s=>{ st.cfg=s.exists?s.data():{}; later(); },()=>{});
  if(isAdmin()) db.doc("config/paket").onSnapshot(s=>{ st.paket=s.exists?s.data():{}; later(); },()=>{});
  if(st.role==="master") db.doc("config/einkommen").onSnapshot(s=>{ st.eink=s.exists?s.data():{}; later(); },()=>{});
})();
</script>
</body>
</html>
